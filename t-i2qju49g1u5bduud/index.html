<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dealer Tip & Income Tracker</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --input-bg: #ffffff;
      --header-bg: #f1f5f9;
      --table-stripe: #f8fafc;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --input-bg: #0f172a;
      --header-bg: #111827;
      --table-stripe: #182234;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-area h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .title-area p {
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      background: var(--card-bg);
      color: var(--text-main);
      transition: background-color 0.2s, border-color 0.2s;
    }

    button.btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
    }

    .metric-card span {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    .metric-card p {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 4px;
    }

    .metric-card.accent p {
      color: var(--accent);
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-card h2 {
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .form-group input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.875rem;
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th {
      background: var(--header-bg);
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    tbody tr:nth-child(even) {
      background-color: var(--table-stripe);
    }

    .font-bold {
      font-weight: 600;
    }

    .text-accent {
      color: var(--accent);
    }

    .btn-delete {
      padding: 4px 8px;
      font-size: 0.75rem;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .empty-state {
      padding: 32px;
      text-align: center;
      color: var(--text-sub);
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>Blackjack Dealer Earnings</h1>
        <p>Tips & Paycheck Log</p>
      </div>
      <div class="header-actions">
        <button id="themeToggle" aria-label="Toggle Theme">🌙 Dark</button>
        <button id="clearDataBtn" class="btn-delete">Clear All Data</button>
      </div>
    </header>

    <!-- Metrics Header -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span>Total Tips</span>
        <p id="metricTotalTips">$0.00</p>
      </div>
      <div class="metric-card">
        <span>Total Paychecks</span>
        <p id="metricTotalPaychecks">$0.00</p>
      </div>
      <div class="metric-card accent">
        <span>Grand Total Income</span>
        <p id="metricGrandTotal">$0.00</p>
      </div>
    </div>

    <!-- Add Entry Form -->
    <div class="form-card">
      <h2>Log Weekly Shift Earnings</h2>
      <form id="entryForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="weekEnding">Week Ending Date</label>
            <input type="date" id="weekEnding" required>
          </div>
          <div class="form-group">
            <label for="luckyStrike">Lucky Strike ($)</label>
            <input type="number" id="luckyStrike" step="0.01" min="0" placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="bootleggers">Bootlegrz ($)</label>
            <input type="number" id="bootleggers" step="0.01" min="0" placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="capri">The Capri ($)</label>
            <input type="number" id="capri" step="0.01" min="0" placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="paycheck">Paycheck ($)</label>
            <input type="number" id="paycheck" step="0.01" min="0" placeholder="0.00">
          </div>
        </div>
        <button type="submit" class="btn-primary">Add Entry</button>
      </form>
    </div>

    <!-- Weekly Log Table -->
    <div class="table-card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Week Ending</th>
              <th>Lucky Strike</th>
              <th>Bootlegrz</th>
              <th>The Capri</th>
              <th>Tips Total</th>
              <th>Paycheck</th>
              <th>Gross Income</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="logTableBody">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- STATE & PERSISTENCE ---
      const STORAGE_KEYS = {
        ENTRIES: 'dealerIncome.entries',
        THEME: 'dealerIncome.theme'
      };

      let state = {
        entries: [],
        theme: 'light'
      };

      function loadState() {
        try {
          const savedEntries = localStorage.getItem(STORAGE_KEYS.ENTRIES);
          state.entries = savedEntries ? JSON.parse(savedEntries) : [];
        } catch (e) {
          console.error('Failed to load entries from localStorage, resetting:', e);
          state.entries = [];
        }

        const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
        if (savedTheme) {
          state.theme = savedTheme;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          state.theme = 'dark';
        }
      }

      function saveEntries() {
        localStorage.setItem(STORAGE_KEYS.ENTRIES, JSON.stringify(state.entries));
      }

      function saveTheme() {
        localStorage.setItem(STORAGE_KEYS.THEME, state.theme);
      }

      // --- HELPERS ---
      function formatCurrency(num) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num || 0);
      }

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // --- THEME ENGINE ---
      function applyTheme() {
        document.documentElement.setAttribute('data-theme', state.theme);
        const themeToggleBtn = document.getElementById('themeToggle');
        if (themeToggleBtn) {
          themeToggleBtn.textContent = state.theme === 'dark' ? '☀️ Light' : '🌙 Dark';
        }
      }

      function toggleTheme() {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        saveTheme();
        applyTheme();
      }

      // --- RENDERING ---
      function render() {
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';

        let grandTips = 0;
        let grandPaychecks = 0;

        // Sort descending by date
        state.entries.sort((a, b) => new Date(b.weekEnding) - new Date(a.weekEnding));

        if (state.entries.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" class="empty-state">No income records found. Fill out the form above to log your shift.</td>
            </tr>
          `;
        } else {
          state.entries.forEach(entry => {
            const ls = Number(entry.luckyStrike) || 0;
            const boot = Number(entry.bootleggers) || 0;
            const capri = Number(entry.capri) || 0;
            const paycheck = Number(entry.paycheck) || 0;

            const totalTips = ls + boot + capri;
            const gross = totalTips + paycheck;

            grandTips += totalTips;
            grandPaychecks += paycheck;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="font-bold">${escapeHTML(entry.weekEnding)}</td>
              <td>${formatCurrency(ls)}</td>
              <td>${formatCurrency(boot)}</td>
              <td>${formatCurrency(capri)}</td>
              <td class="font-bold text-accent">${formatCurrency(totalTips)}</td>
              <td>${formatCurrency(paycheck)}</td>
              <td class="font-bold">${formatCurrency(gross)}</td>
              <td><button class="btn-delete" data-id="${entry.id}">×</button></td>
            `;
            tbody.appendChild(tr);
          });
        }

        // Update Summary Cards
        document.getElementById('metricTotalTips').textContent = formatCurrency(grandTips);
        document.getElementById('metricTotalPaychecks').textContent = formatCurrency(grandPaychecks);
        document.getElementById('metricGrandTotal').textContent = formatCurrency(grandTips + grandPaychecks);
      }

      // --- ACTIONS & EVENT HANDLERS ---
      function handleFormSubmit(e) {
        e.preventDefault();

        const weekEnding = document.getElementById('weekEnding').value;
        const luckyStrike = parseFloat(document.getElementById('luckyStrike').value) || 0;
        const bootleggers = parseFloat(document.getElementById('bootleggers').value) || 0;
        const capri = parseFloat(document.getElementById('capri').value) || 0;
        const paycheck = parseFloat(document.getElementById('paycheck').value) || 0;

        if (!weekEnding) return;

        const newEntry = {
          id: Date.now().toString(),
          weekEnding,
          luckyStrike,
          bootleggers,
          capri,
          paycheck
        };

        state.entries.push(newEntry);
        saveEntries();
        render();

        // Reset form except default date
        e.target.reset();
        document.getElementById('weekEnding').valueAsDate = new Date();
      }

      function handleDeleteEntry(id) {
        state.entries = state.entries.filter(entry => entry.id !== id);
        saveEntries();
        render();
      }

      function handleClearAll() {
        if (confirm('Are you sure you want to clear all logged income entries?')) {
          state.entries = [];
          saveEntries();
          render();
        }
      }

      // --- INITIALIZATION ---
      function init() {
        loadState();
        applyTheme();

        // Default date picker to today
        const dateInput = document.getElementById('weekEnding');
        if (dateInput) {
          dateInput.valueAsDate = new Date();
        }

        // Bind events
        document.getElementById('entryForm').addEventListener('submit', handleFormSubmit);
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('clearDataBtn').addEventListener('click', handleClearAll);

        document.getElementById('logTableBody').addEventListener('click', function(e) {
          if (e.target.classList.contains('btn-delete')) {
            const id = e.target.getAttribute('data-id');
            if (id) handleDeleteEntry(id);
          }
        });

        render();
      }

      // Run on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
